ahs Link registrieren",joinNote:"Prüfen Sie den Empfehlungslink immer, bevor Sie die Registrierung abschließen.",footer:"Informationsleitfaden — prüfen Sie immer die aktuellen offiziellen Bedingungen der Plattform.",level:"Stufe",clicks:"Klicks / Tag",campaign:"Angegebene Kampagne",fee:"+ anfängliche Aktivierungsgebühr",how:["Sehen Sie sich zuerst die Präsentation an.","Folgen Sie als neues Mitglied dem Registrierungs-Tutorial.","Prüfen Sie vor einer Kampagne die Stufe, den Betrag und mögliche Aktivierungsgebühren.","Prüfen Sie Ihr Konto für Klickbestätigungen und Auszahlungen."],important:["Prüfen Sie Ihren Empfehlungslink vor der Registrierung.","Aktivierungsgebühren: prüfen Sie den beim Kauf angezeigten Betrag.","Kampagnen: das angegebene Limit beträgt 3 gleichzeitige Kampagnen; prüfen Sie die aktuellen Regeln.","Auszahlungen: prüfen Sie Bearbeitungszeiten und Verlauf in Ihrem Konto.","Sicherheit: geben Sie niemals Passwort, Sicherheitscodes oder private Schlüssel weiter."],faq:[["Wie viele Kampagnen gleichzeitig?","Die in diesem Leitfaden angegebene Regel sind 3 gleichzeitige Kampagnen. Prüfen Sie immer die aktuelle Regel."],["Gibt es Aktivierungsgebühren?","Für die erste Kampagne einer Stufe können je nach angegebenen Bedingungen Gebühren anfallen."],["Wie prüfe ich die Klicks?","Nutzen Sie das entsprechende Tutorial und prüfen Sie die in Ihrem Konto angezeigten Informationen."],["Wie beantrage ich eine Auszahlung?","Sehen Sie sich das Tutorial „Auszahlung“ und das aktuell angezeigte Verfahren an."]]},
mg:{subtitle:"Torolalana azo ampiharina — fomba fiasa, fanentanana, kitika ary fampianarana",navPresentation:"Fampahafantarana",navTutorials:"Fampianarana",navLevels:"Ambaratonga",navImportant:"Fampahalalana manan-danja",welcomeTitle:"👋 Tongasoa",welcomeText:"Tongasoa eto amin’ity torolalana azo ampiharina momba ny fampiasana ClickBaitPays ity. Eto ianao dia hahita ireo fampianarana fototra, fampahalalana momba ny ambaratongan’ny fanentanana ary ireo zavatra manan-danja tokony hojerena alohan’ny hanaovana hetsika.",referenceText:"Torolalana azo ampiharina ny fampahalalana eto. Ny fepetra aseho ao amin’ny sehatra ofisialy no mbola loharano ianteherana.",presentationTitle:"🎬 Fampahafantarana ClickBaitPays",presentationText:"Ireto ny sary fampahafantarana roa tafiditra ao amin’ny tranonkala. Mampiseho ny firafitry ny tranonkala sy ireo pejy natao hanampiana ny mpikambana vaovao izy ireo.",plan12:"Drafitra feno — pejy 12",plan20:"Drafitra feno — pejy 20",tutorialTitle:"🎬 Horonan-tsary fampianarana",tutorialText:"Horonan-tsary fampianarana efatra no voangona eto mba hanamora ny fahatakarana ny fomba fiasan’ny sehatra.",videoPresentation:"▶ Fampahafantarana",videoRegistration:"▶ Fisoratana anarana",videoStrategy:"▶ Paikady",videoWithdrawal:"▶ Fisintonana",levelsTitle:"📊 Kitika dokambarotra isaky ny ambaratonga",verifyValues:"Hamarino hatrany ny sanda aseho amin’izao fotoana izao ao amin’ny kaontinao.",howTitle:"📝 Fomba fampiasana ity torolalana ity",importantTitle:"⚠️ Fampahalalana manan-danja",securityTitle:"🔐 Fiarovana & fanamarinana",securityText:"Alohan’ny hampidirana fampahalalana manokana na hanaovana hetsika, hamarino fa ao amin’ny tranonkala ofisialy ianao ary mifanaraka amin’ny kaontinao ny fampahalalana aseho.",faqTitle:"❓ Fanontaniana matetika",communityTitle:"👥 Ekipa & vondrom-piarahamonina",communityText:"Jereo ao amin’ny Telegram ny fampianarana, fampandrenesana ary fifanakalozan-kevitry ny vondrom-piarahamonina.",telegram:"Sokafy Telegram",joinTitle:"MIARAHA AMINAY",joinText:"Raha te hampiasa ny rohy manokan’i Marinah ianao:",joinButton:"Misoratra anarana amin’ny rohin’i Marinah",joinNote:"Hamarino hatrany ny rohy fanasana alohan’ny hamitana ny fisoratana anarana.",footer:"Torolalana fampahalalana — hamarino hatrany ny fepetra ofisialy sy manankery ao amin’ny sehatra.",level:"Ambaratonga",clicks:"kitika / andro",campaign:"Fanentanana voalaza",fee:"+ saram-pampandehanana voalohany",how:["Jereo aloha ny fampahafantarana.","Araho ny fampianarana fisoratana anarana raha mpikambana vaovao ianao.","Alohan’ny hanombohana fanentanana, hamarino ny ambaratonga, ny vola ary ny saram-pampandehanana raha misy.","Jereo ao amin’ny kaontinao ny fanamarinana kitika sy ny fisintonana."],important:["Hamarino ny rohy fanasanao alohan’ny fisoratana anarana.","Saram-pampandehanana: hamarino ny vola aseho amin’ny fotoana fividianana.","Fanentanana: 3 no fetra voalaza ho an’ny fanentanana mandeha miaraka; hamarino ny fitsipika ankehitriny.","Fisintonana: jereo ao amin’ny kaontinao ny fe-potoana fikarakarana sy ny tantara.","Fiarovana: aza mizara mihitsy ny tenimiafinao, kaody fiarovana na lakile manokana."],faq:[["Firy ny fanentanana afaka mandeha miaraka?","Ny fitsipika voalaza ato amin’ity torolalana ity dia fanentanana 3 mandeha miaraka. Hamarino hatrany ny fitsipika ankehitriny."],["Misy saram-pampandehanana ve?","Mety hisy sara amin’ny fanentanana voalohany amin’ny ambaratonga iray, arakaraka ny fepetra voalaza."],["Ahoana no hanamarinana ny kitika?","Ampiasao ny fampianarana natokana ary jereo ny fampahalalana aseho ao amin’ny kaontinao."],["Ahoana no hangatahana fisintonana?","Jereo ny fampianarana ‘Fisintonana’ sy ny dingana aseho amin’izao fotoana izao."]]},
ru:{subtitle:"Практическое руководство — принцип работы, кампании, клики и инструкции",navPresentation:"Презентация",navTutorials:"Инструкции",navLevels:"Уровни",navImportant:"Важная информация",welcomeTitle:"👋 Добро пожаловать",welcomeText:"Добро пожаловать в практическое руководство по использованию ClickBaitPays. Здесь собраны основные инструкции, информация об уровнях кампаний и важные моменты, которые следует проверить перед выполнением любых операций.",referenceText:"Информация на этой странице носит справочный характер. Актуальные условия, отображаемые на официальной платформе, остаются основным источником.",presentationTitle:"🎬 Презентация ClickBaitPays",presentationText:"Ниже представлены два обзорных изображения сайта. Они показывают структуру сайта и разделы, предназначенные для помощи новым участникам.",plan12:"Полный план сайта — 12 страниц",plan20:"Полный план сайта — 20 страниц",tutorialTitle:"🎬 Видеоинструкции",tutorialText:"Здесь собраны четыре видеоинструкции, которые помогут разобраться в работе платформы.",videoPresentation:"▶ Презентация",videoRegistration:"▶ Регистрация",videoStrategy:"▶ Стратегия",videoWithdrawal:"▶ Вывод средств",levelsTitle:"📊 Рекламные клики по уровням",verifyValues:"Всегда проверяйте актуальные значения, отображаемые в вашем аккаунте.",howTitle:"📝 Как пользоваться руководством",importantTitle:"⚠️ Важная информация",securityTitle:"🔐 Безопасность и проверка",securityText:"Перед вводом личных данных или выполнением операции убедитесь, что вы находитесь на официальном сайте и что отображаемая информация соответствует вашему аккаунту.",faqTitle:"❓ Часто задаваемые вопросы",communityTitle:"👥 Команда и сообщество",communityText:"Инструкции, объявления и обсуждения сообщества доступны в Telegram.",telegram:"Открыть Telegram",joinTitle:"ПРИСОЕДИНЯЙТЕСЬ К НАМ",joinText:"Если вы хотите использовать персональную ссылку Marinah:",joinButton:"Зарегистрироваться по ссылке Marinah",joinNote:"Всегда проверяйте реферальную ссылку перед завершением регистрации.",footer:"Информационное руководство — всегда проверяйте актуальные официальные условия платформы.",level:"Уровень",clicks:"кликов / день",campaign:"Указанная кампания",fee:"+ первоначальная плата за активацию",how:["Сначала ознакомьтесь с презентацией.","Если вы новый участник, следуйте инструкции по регистрации.","Перед запуском кампании проверьте уровень, сумму и возможную плату за активацию.","Проверяйте в аккаунте подтверждение кликов и информацию о выводе средств."],important:["Проверьте реферальную ссылку перед регистрацией.","Плата за активацию: проверьте сумму, указанную в момент покупки.","Кампании: указан лимит в 3 одновременные кампании; проверяйте актуальные правила.","Вывод средств: проверяйте сроки обработки и историю в своем аккаунте.","Безопасность: никогда не передавайте пароль, коды безопасности или приватные ключи."],faq:[["Сколько кампаний можно запускать одновременно?","В этом руководстве указан лимит в 3 одновременные кампании. Всегда проверяйте актуальные правила."],["Есть ли плата за активацию?","В зависимости от указанных условий плата может применяться к первой кампании определенного уровня."],["Как проверить клики?","Используйте соответствующую инструкцию и проверяйте информацию, отображаемую в вашем аккаунте."],["Как запросить вывод средств?","Ознакомьтесь с инструкцией «Вывод средств» и актуальной процедурой на платформе."]]},

u trước khi hoàn tất đăng ký.",footer:"Hướng dẫn thông tin — luôn kiểm tra các điều kiện chính thức và hiện hành của nền tảng.",level:"Cấp",clicks:"lượt nhấp / ngày",campaign:"Chiến dịch được công bố",fee:"+ phí kích hoạt ban đầu",how:["Xem phần giới thiệu trước.","Làm theo video hướng dẫn đăng ký nếu bạn là thành viên mới.","Trước khi bắt đầu chiến dịch, hãy kiểm tra cấp độ, số tiền và các khoản phí kích hoạt nếu có.","Kiểm tra tài khoản của bạn để xác nhận lượt nhấp và việc rút tiền."],important:["Kiểm tra liên kết giới thiệu của bạn trước khi đăng ký.","Phí kích hoạt: kiểm tra số tiền hiển thị tại thời điểm mua.","Chiến dịch: giới hạn được thông báo là 3 chiến dịch cùng lúc; hãy kiểm tra quy định hiện hành.","Rút tiền: kiểm tra thời gian xử lý và lịch sử trong tài khoản.","Bảo mật: không bao giờ chia sẻ mật khẩu, mã bảo mật hoặc khóa riêng tư của bạn."],faq:[["Có thể chạy bao nhiêu chiến dịch cùng lúc?","Quy định được nêu trong hướng dẫn này là 3 chiến dịch cùng lúc. Hãy luôn kiểm tra quy định hiện hành."],["Có phí kích hoạt không?","Phí có thể áp dụng cho chiến dịch đầu tiên của một cấp độ, tùy theo các điều kiện được công bố."],["Làm thế nào để kiểm tra lượt nhấp?","Sử dụng video hướng dẫn tương ứng và kiểm tra thông tin hiển thị trong tài khoản của bạn."],["Làm thế nào để yêu cầu rút tiền?","Xem video hướng dẫn ‘Rút tiền’ và quy trình hiện đang hiển thị."]]}}
const levels=[[1,3,13,1],[2,3,77,7],[3,3,150,15],[4,5,300,30],[5,6,600,60],[6,12,1200,120],[7,20,2400,240]];
function setLang(l){const t=T[l];document.documentElement.lang=l;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t[e.dataset.i]);document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));document.getElementById('levelsGrid').innerHTML=levels.map(x=>`<div class="level"><h3>${t.level} ${x[0]}</h3><b>${x[1]} ${t.clicks}</b><p>${t.campaign}: ${x[2].toLocaleString(l==='vi'?'vi-VN':l==='fr'?'fr-FR':l==='es'?'es-ES':l==='it'?'it-IT':l==='pt'?'pt-PT':l==='de'?'de-DE':l==='mg'?'mg-MG':l==='ru'?'ru-RU':'en-US')} USDT ${t.fee}: ${x[3]} USDT.</p></div>`).join('');document.getElementById('howList').innerHTML=t.how.map(x=>`<li>${x}</li>`).join('');document.getElementById('importantList').innerHTML=t.important.map(x=>`<li>${x}</li>`).join('');document.getElementById('faqContent').innerHTML=t.faq.map(x=>`<h3>${x[0]}</h3><p>${x[1]}</p>`).join('');localStorage.setItem('cbp-lang',l)}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));setLang('mg');
